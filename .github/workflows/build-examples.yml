name: Build examples

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: ${{ matrix.category }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category: [api-styles, authentication, architecture, integration, infrastructure, user-interface, reference]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            NuGet.config

      - name: Ensure NuGet cache directory exists
        shell: bash
        run: mkdir -p "$HOME/.nuget/packages"

      - name: Validate manifest and show tracked exclusions
        shell: pwsh
        run: ./scripts/ci/Test-ExampleBuildManifest.ps1

      - name: Restore
        shell: pwsh
        run: ./scripts/ci/Invoke-ExampleValidation.ps1 -Category '${{ matrix.category }}' -Action restore

      - name: Build
        shell: pwsh
        run: ./scripts/ci/Invoke-ExampleValidation.ps1 -Category '${{ matrix.category }}' -Action build

      - name: Pre-pull SQL Server image for orchestration tests
        if: matrix.category == 'reference'
        shell: bash
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Test
        shell: pwsh
        env:
          # Aspire 13.4.x DCP hangs starting its internal API server on hosted runners,
          # which have no ASP.NET developer certificate. See microsoft/aspire#18041.
          ASPIRE_DCP_USE_DEVELOPER_CERTIFICATE: "false"
        run: ./scripts/ci/Invoke-ExampleValidation.ps1 -Category '${{ matrix.category }}' -Action test

  infrastructure-integration-tests:
    name: Infrastructure-dependent tests
    runs-on: ubuntu-latest
    if: ${{ false }} # Enable when a manifest entry gains an integration test requiring Compose services.
    steps:
      - name: No infrastructure integration tests are currently declared
        run: echo "Compile validation is independent from Redis, RabbitMQ, SQL Server, and MongoDB."
